<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FeedBack</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: black;
        color: white;
      }
      h4 {
        text-decoration: underline;
        margin: 5px;
        font-weight: bold;
      }

      div {
        margin: 5px;
        padding: 5px;
      }

      div label {
        font-weight: bold;
      }
      .submit {
        text-align: center;
      }
      .submit input {
        background-color: hwb(212 54% 13%);
        /*   border: 2px solid hwb(246 0% 0%);*/
        border-radius: 10px;
        font-weight: bold;
        color: blue;
        width: 80px;
        height: 30px;
        margin: 10px;
        font-weight: bold;
        font-size: 18px;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        transition: transform 0.2s;
      }
      .submit input:hover {
        transform: scale(1.2);
      }
      .submit input:active {
        transform: scale(1.2);
      }
    </style>
  </head>
  <body>
    <h4>Give your FeedBack here ⬇️</h4>
    <form>
      <!--- user name --->
      <div>
        <label for="username">Name:</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter Your Name"
        />
      </div>
      <!--- user email --->
      <div>
        <label for="useremail">Email:</label>
        <input
          type="email"
          id="useremail"
          name="useremail"
          placeholder="Enter Your Email"
        />
      </div>
      <!--- subject ---->
      <div>
        <label for="Subject">Subject:</label>
        <input
          type="text"
          id="subject"
          name="subject"
          placeholder="Enter Subject"
        />
      </div>
      <!--- feedback ---->
      <div>
        <label for="userMessage">FeedBack:</label>
        <textarea
          rows="3"
          cols="30"
          id="userMessage"
          name="userMessage"
          placeholder="Type your feedback here"
        ></textarea>
      </div>
      <!--- submit --->
      <div class="submit">
        <input
          type="submit"
          name="submit"
          value="Submit"
          onclick="alert('Your feedback submited successfully')"
        />
        <input
          type="reset"
          name="reset"
          value="Reset"
          onclick="alert('Form Reset')"
        />
      </div>
    </form>
  </body>
</html>
