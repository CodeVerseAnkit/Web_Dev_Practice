<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Css Display property</title>
        <style>
            * {
                margin: 2px 0px;
                padding: 2px;
                /* border: 2px solid black ;*/

                box-sizing: border-box;
            }
            h1 {
                color: red;
                background-color: yellow;
                font-family: Comic Sans MS;
            }
            h2 {
                text-decoration: underline;
                font-family: Times New Roman;
            }
            .b1 {
                display: inline;
                background-color: blue;
                /*  border: 5px solid black;*/
            }
            .b2 {
                display: block;
            }
            .b3 {
                display: inline-block;
                width: 40px;
                border: 5px solid black;
            }
            .b4 {
                display: none;
                border: 5px solid blue;
            }
            .bigbox {
                display: flex;
                border: 5px dotted #9d0101;
            }
            .gridbox {
                display: grid;
                grid-template-columns: 100px 100px;
                gap: 20px;
            }
            .b6 {
                color: white;
                background-color: #15dcff;
                padding: 20px;
            }
        </style>
    </head>
    <body>
        <h1>Important Css Display property</h1>
        <h2>Display : inline;</h2>
        <div>
            <div class="b1">Box1</div>
            <div class="b1">Box2</div>
        </div>
        <h2>Display : block;</h2>
        <div>
            <span class="b2">Box1</span>
            <span class="b2">Box2</span>
        </div>
        <h2>Display : inline-block;</h2>
        <div>
            <div class="b3">Box1</div>
            <div class="b3">Box2</div>
        </div>
        <h2>Display : none;</h2>
        <div>
            <div class="b4">Box1</div>
            <div class="b4">Box2</div>
        </div>
        <h2>Display : flex;</h2>
        <div class="bigbox">
            <div class="b5">Box1</div>
            <div class="b5">Box2</div>
        </div>
        <h2>Display : grid;</h2>
        <div class="gridbox">
            <div class="b6">Box1</div>
            <div class="b6">Box2</div>
            <div class="b6">Box3</div>
            <div class="b6">Box4</div>
        </div>
    </body>
</html>
